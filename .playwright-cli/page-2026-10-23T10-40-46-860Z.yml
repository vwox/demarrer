    - heading "Le bouton ne fait rien ?" [level=2] [ref=e13]
    - paragraph [ref=e14]: Copiez la demande, ouvrez l'application Claude, onglet Code, collez-la, puis Envoyer.
    - generic [ref=e15]: "Installe proprement sur mon PC GitHub, Git et ce qui peut être utile, au bon endroit. Connecte mon compte GitHub (pjean-baptiste-hub, déjà connecté dans Edge), accepte mes invitations en attente et récupère mes dossiers (zita, prepa). Prépare chaque étape (ouvre les pages, donne-moi le texte prêt à copier-coller) : je n'ai qu'à valider, je fais moi-même les confirmations et les mots de passe. Fais une micro-doc. Je ne suis pas du tout technique : parle-moi avec des mots ultra simples, en français, sans jargon, explique le moins possible, ne m'embrouille pas avec GitHub. Fais en sorte que tout reste propre, même si mes demandes ne sont pas claires. N'hésite pas à mettre d'autres projets sur GitHub quand c'est utile, tant que ça me prend zéro temps et zéro décision ; je comprendrai plus tard, à l'usage. Synchronise toujours tout automatiquement (un script qui envoie tout tout seul, c'est parfait) : jamais de branches ni de fusions compliquées, jamais de question là-dessus, et ne me dis pas « j'ai poussé » : c'est du jargon. Note ces règles dans tes instructions permanentes pour la suite."
