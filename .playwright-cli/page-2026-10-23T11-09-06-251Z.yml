  - generic [ref=e15]:
    - heading "Aucun bouton ne fait rien ?" [level=2] [ref=e16]
    - paragraph [ref=e17]: Copiez la demande, ouvrez l'application Claude, collez-la, puis Envoyer.
    - generic [ref=e18]: "Installe proprement sur mon PC Git, GitHub et ce qui peut être utile (par le terminal, une extension ou le contrôle de l'écran). Connecte mon compte GitHub (pjean-baptiste-hub, déjà connecté dans Edge), accepte mes invitations et récupère mes dossiers (zita, prepa). Prépare chaque étape (pages ouvertes, texte prêt à coller) : je ne fais que valider et taper mes mots de passe. Fais une micro-doc. Je ne suis pas du tout technique : mots ultra simples, en français, sans jargon, le moins d'explications possible. Garde tout propre même si mes demandes sont floues ; mets d'autres projets sur GitHub quand c'est utile, sans me demander de décision. Synchronise tout automatiquement (un script qui envoie tout seul, c'est parfait), sans branches ni questions, et ne me dis jamais « j'ai poussé » : c'est du jargon. Note ces règles dans tes instructions permanentes. Fais un vrai test de bout en bout, puis dis-moi : « C'est bon, tout marche. Pour essayer, je peux créer ou modifier n'importe quel site : par exemple renommer vwox.github.io/prepa en vwox.github.io/prepa-mariage-lagrasse, ou changer sa couleur selon le temps liturgique. » Si tu ne peux rien installer d'ici, dis-moi en une phrase de rouvrir cette demande dans l'onglet Code."
